name: Apply fast zombie game logic

on:
  push:
    branches:
      - 1.9.2
    paths:
      - "index.html"
      - "tools/patch_fast_zombies.py"
      - ".github/workflows/apply-fast-zombies.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch-game:
    runs-on: ubuntu-latest
    steps:
      - name: Check out 1.9.2
        uses: actions/checkout@v4
        with:
          ref: 1.9.2
      - name: Patch the game's embedded JavaScript
        run: python3 tools/patch_fast_zombies.py
      - name: Commit the game-code changes
        run: |
          if git diff --quiet -- index.html; then
            echo "No index.html changes were made."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Implement fast zombie behavior in game code"
          git push origin HEAD:1.9.2
