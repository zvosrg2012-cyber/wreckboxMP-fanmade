name: Clean up duplicate map menu and inspect game runtime
on:
  push:
    branches: [fan-update-1.8]
    paths:
      - 'scripts/integrate-menu.mjs'
      - '.github/workflows/integrate-menu.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  integrate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fan-update-1.8
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Remove duplicate chooser and inspect existing game APIs
        run: node scripts/integrate-menu.mjs
      - name: Commit cleanup and runtime report
        run: |
          if [ -z "$(git status --porcelain -- index.html runtime-api-report.md)" ]; then
            echo "No changes needed."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html runtime-api-report.md
          git commit -m "Remove duplicate map menu and inspect existing game runtime"
          git push origin HEAD:fan-update-1.8
