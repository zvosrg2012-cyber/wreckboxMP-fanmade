name: Inspect original map implementation
on:
  push:
    branches: [fan-update-1.8]
    paths:
      - 'scripts/inspect-map-runtime.mjs'
      - '.github/workflows/inspect-map-runtime.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fan-update-1.8
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: node scripts/inspect-map-runtime.mjs
      - name: Commit excerpts
        run: |
          if [ -z "$(git status --porcelain -- runtime-map-excerpts.md)" ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime-map-excerpts.md
          git commit -m "Inspect original map generator"
          git push origin HEAD:fan-update-1.8
