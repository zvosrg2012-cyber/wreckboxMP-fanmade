name: Build browser game with multiplayer test UI
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: browser-build
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Prepare web build
        run: |
          mkdir -p dist
          cp -R index.html assets inventory.json dist/ 2>/dev/null || true
          cp multiplayer-ui.js dist/multiplayer-ui.js
          python3 - <<'PY'
          from pathlib import Path
          p = Path("dist/index.html")
          html = p.read_text(encoding="utf-8")
          tag = '<script src="./multiplayer-ui.js"></script>'
          if tag not in html:
              pos = html.lower().rfind("</body>")
              html = html[:pos] + tag + html[pos:] if pos >= 0 else html + tag
          p.write_text(html, encoding="utf-8")
          PY
          touch dist/.nojekyll
      - name: Upload playable browser build
        uses: actions/upload-artifact@v4
        with:
          name: wreckbox-web-build
          path: dist/
          if-no-files-found: error
          retention-days: 30
