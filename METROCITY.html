<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>МЕТРОСИТИ — интерактивная карта</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#10151a;color:#eef3f5;font:14px system-ui,sans-serif}canvas{display:block;width:100vw;height:100vh;image-rendering:pixelated}#hud{position:fixed;left:12px;top:12px;max-width:min(620px,calc(100vw - 24px));padding:10px 13px;background:#101820eF;border:1px solid #64737c;border-radius:7px;line-height:1.5;pointer-events:none}#hud b{color:#8fe1e9}#help{position:fixed;right:12px;top:12px;padding:10px 12px;background:#101820eF;border:1px solid #64737c;border-radius:7px;line-height:1.55;max-width:230px}#status{color:#b9d4a2}button{pointer-events:auto;background:#263841;color:#fff;border:1px solid #84969e;padding:5px 9px;border-radius:4px}@media(max-width:650px){#help{top:auto;bottom:10px;right:8px;font-size:11px;max-width:185px}#hud{font-size:12px}}
</style>
</head>
<body>
<canvas id="game" aria-label="Игровая карта МЕТРОСИТИ"></canvas>
<div id="hud"><b>МЕТРОСИТИ</b> · интерактивная карта<br><span id="where">Поверхность города</span> · <span id="status">Станции: 01 ↔ 02 · поезд в движении</span></div>
<div id="help"><b>Управление</b><br>← → / A D — движение<br>↑ ↓ / W S — лестница<br>Пробел — прыжок<br>E — войти в поезд<br><button id="reset">Вернуть игрока</button></div>
<script>
(()=> {
const c=document.getElementById('game'),ctx=c.getContext('2d'),where=document.getElementById('where'),status=document.getElementById('status');
let W=0,H=0,dpr=1,cam=0,last=0,keys={},time=0,ride=false;
const world={width:2600,ground:255,soilBottom:610,tunnelTop:390,tunnelBottom:565};
const player={x:180,y:0,vx:0,vy:0,w:22,h:38,onGround:false,inTunnel:false,inTrain:false,station:0};
player.y=world.ground-player.h;
const train={x:480,y:482,w:156,h:42,dir:1,speed:115,doors:false};
const stations=[{x:390,name:'СТАНЦИЯ 01',label:'ГОРОДСКАЯ ЛИНИЯ'},{x:1990,name:'СТАНЦИЯ 02',label:'БУНКЕРНЫЙ СЕКТОР'}];
const buildings=[
{x:40,w:120,h:95,c:'#56666c'},{x:195,w:90,h:125,c:'#3d555f'},{x:325,w:110,h:80,c:'#596c70'},
{x:610,w:120,h:150,c:'#44545d'},{x:775,w:95,h:100,c:'#58676b'},{x:920,w:140,h:125,c:'#3b4f58'},
{x:1170,w:100,h:85,c:'#58696b'},{x:1320,w:150,h:155,c:'#465861'},{x:1535,w:90,h:112,c:'#536368'},
{x:1770,w:115,h:90,c:'#435760'},{x:2170,w:140,h:145,c:'#4b5c63'},{x:2380,w:100,h:105,c:'#5c6b6e'}];
const npcs=Array.from({length:18},(_,i)=>({x:100+i*132,y:0,dir:i%2?1:-1,spd:12+(i%4)*5,seed:i}));
function resize(){dpr=Math.min(devicePixelRatio||1,2);W=innerWidth;H=innerHeight;c.width=Math.floor(W*dpr);c.height=Math.floor(H*dpr);ctx.setTransform(dpr,0,0,dpr,0,0)}
addEventListener('resize',resize);resize();addEventListener('keydown',e=>{keys[e.key.toLowerCase()]=true;if([' ','ArrowUp','ArrowDown','ArrowLeft','ArrowRight'].includes(e.key))e.preventDefault();if(e.key.toLowerCase()==='e')interact()});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
document.getElementById('reset').onclick=()=>{player.x=180;player.y=world.ground-player.h;player.vx=player.vy=0;player.inTunnel=player.inTrain=false;ride=false};
function interact(){if(player.inTrain){player.inTrain=false;player.x=train.x+train.w+8;player.y=world.tunnelBottom-player.h;return}if(player.inTunnel&&Math.abs(player.x-train.x-train.w/2)<125&&Math.abs(player.y-(train.y-player.h))<75){player.inTrain=true;player.vx=player.vy=0;return}if(!player.inTunnel&&Math.abs(player.x-390)<45){player.inTunnel=true;player.x=stations[0].x;player.y=world.tunnelBottom-player.h;return}if(player.inTunnel&&(Math.abs(player.x-stations[0].x)<40||Math.abs(player.x-stations[1].x)<40)&&player.y>world.tunnelTop+30){player.inTunnel=false;player.y=world.ground-player.h}}
function rect(x,y,w,h,col){ctx.fillStyle=col;ctx.fillRect(Math.round(x),Math.round(y),w,h)}
function text(t,x,y,size=12,col='#e8eff1',align='left'){ctx.fillStyle=col;ctx.font='700 '+size+'px system-ui';ctx.textAlign=align;ctx.fillText(t,x,y)}
function drawCity(){rect(0,0,W,H,'#a5b9b9');let groundY=H*.39,scale=H/720;world.ground=groundY;world.tunnelTop=H*.59;world.tunnelBottom=H*.87;rect(0,groundY,W,H-groundY,'#4b4237');rect(0,groundY,W,8,'#83936c');for(let x=0;x<W+80;x+=80){rect(x,groundY+15,48,5,'#55493c');rect(x+28,groundY+46,27,4,'#594b3e')}
for(let i=0;i<buildings.length;i++){let b=buildings[i],x=b.x-cam;if(x<-180||x>W+20)continue;let h=b.h*scale,w=b.w*scale,y=groundY-h;rect(x,y,w,h,b.c);rect(x-3,y-5,w+6,6,'#29373e');for(let wy=y+13;wy<groundY-8;wy+=20)for(let wx=x+9;wx<x+w-8;wx+=19){rect(wx,wy,9,9,(Math.floor(wx+wy)%3?'#d3c58e':'#6d898e'))}rect(x+w*.35,groundY-24,Math.max(13,w*.3),24,'#303a3e')}
 // street, lamps and pedestrians
 rect(0,groundY-4,W,4,'#d5d0b8');for(let x=30-(cam%120);x<W;x+=120){rect(x,groundY-75,3,70,'#3e4a4d');rect(x-8,groundY-78,22,5,'#e7dfb4');rect(x-6,groundY-77,18,3,'#fff0bd')}
 // metro entrances and clear stair shafts
 for(const s of stations){let x=s.x-cam;if(x>-100&&x<W+100){rect(x-29,groundY-12,58,12,'#303a3f');rect(x-22,groundY-32,44,21,'#24353e');text('M',x,groundY-17,15,'#70e3e6','center');rect(x-13,groundY-10,26,10,'#101820');}}
 // soil layer + underground cutaway
 rect(0,groundY+8,W,H-groundY-8,'#514438');for(let y=groundY+18;y<H;y+=29){ctx.strokeStyle='#665541';ctx.lineWidth=1;ctx.beginPath();ctx.moveTo(0,y);ctx.lineTo(W,y+5);ctx.stroke();for(let x=18-(cam%72);x<W;x+=72){rect(x,y+7,3,2,'#766047')}}
 let ty=world.tunnelTop,tb=world.tunnelBottom;rect(0,ty,W,tb-ty,'#171f24');rect(0,ty,W,12,'#9aa5a8');rect(0,tb-12,W,12,'#9aa5a8');rect(0,ty+12,W,4,'#526168');rect(0,tb-16,W,4,'#526168');
 for(let x=-(cam%170);x<W;x+=170){rect(x,ty+12,14,tb-ty-24,'#39484e');rect(x+14,ty+12,4,tb-ty-24,'#738188');rect(x+27,ty+25,45,3,'#ffe6a2');rect(x+27,ty+25,45,1,'#fff6ce')}
 // stations platforms and track
 for(let i=0;i<stations.length;i++){let s=stations[i],x=s.x-cam;rect(x-100,ty+38,200,tb-ty-50,'#202d34');rect(x-100,ty+38,200,5,i?'#58bac7':'#dfbf60');text(s.name,x,ty+61,14,'#f1f4f5','center');text(s.label,x,ty+78,9,'#a9bac0','center');for(let k=-2;k<=2;k++){rect(x+k*24-10,tb-53,20,6,'#829097');rect(x+k*24-10,tb-47,20,4,'#4c5a60')}rect(x-97,tb-24,194,5,'#bcc6c9')}
 // stairs connecting ground to platforms
 for(const s of stations){let x=s.x-cam;ctx.strokeStyle='#aeb9bd';ctx.lineWidth=12;ctx.beginPath();ctx.moveTo(x,groundY+2);ctx.lineTo(x,ty+43);ctx.stroke();ctx.strokeStyle='#4b5b62';ctx.lineWidth=6;ctx.beginPath();ctx.moveTo(x,groundY+2);ctx.lineTo(x,ty+43);ctx.stroke();ctx.strokeStyle='#d4dfe1';ctx.lineWidth=1;for(let y=groundY+10;y<ty+42;y+=9){ctx.beginPath();ctx.moveTo(x-7,y);ctx.lineTo(x+7,y);ctx.stroke()}}
 // support pillars and hermetic doors
 for(let x=0-(cam%270);x<W;x+=270){rect(x,ty+15,15,tb-ty-28,'#74838a');rect(x+4,ty+15,7,tb-ty-28,'#45545c')}
 for(const s of stations){let x=s.x-cam;rect(x+102,ty+65,8,44,'#adb9bd');rect(x+104,ty+67,4,40,'#4b5b63')}
 // vending machines, clocks and ventilation
 for(const s of stations){let x=s.x-cam;rect(x-78,ty+86,18,33,'#9b4540');rect(x-75,ty+91,12,9,'#9ce1e8');rect(x+65,ty+86,18,33,'#34799b');rect(x+68,ty+91,12,9,'#a2e7ef');rect(x-18,ty+88,30,12,'#0c1519');text('12:45',x-3,ty+97,8,'#b9f3d8','center');rect(x-46,ty+17,92,8,'#53636b');for(let k=0;k<8;k++)rect(x-41+k*11,ty+19,4,4,'#1a252b')}
}
function drawTrain(){let x=train.x-cam,y=world.tunnelTop+world.tunnelBottom?world.tunnelBottom-67:0;train.y=y;if(x>-220&&x<W+50){rect(x+5,y+29,train.w-10,9,'#101519');rect(x,y+5,train.w,31,'#aab8bf');rect(x+4,y+2,train.w-8,29,'#e1e7e7');rect(x+4,y+22,train.w-8,5,'#c54842');for(let k=0;k<5;k++){rect(x+12+k*27,y+7,20,12,'#315361');rect(x+14+k*27,y+9,5,3,'#9ed9e5')}rect(x+9,y+33,20,8,'#11171b');rect(x+train.w-29,y+33,20,8,'#11171b');for(let k=0;k<4;k++){ctx.beginPath();ctx.arc(x+17+k*40,y+38,5,0,Math.PI*2);ctx.fillStyle='#161d21';ctx.fill();ctx.strokeStyle='#9eabb0';ctx.stroke()}if(train.doors){rect(x+66,y+4,25,29,'#253a43');text('ВХОД',x+78,y-4,8,'#fff','center')}}}
function drawCharacter(x,y,color,dir=1){rect(x+5,y+10,12,15,color);rect(x+5,y+1,12,11,'#e0b999');rect(x+4,y,14,4,'#30363b');rect(x+4,y+25,5,12,'#252b30');rect(x+13,y+25,5,12,'#252b30');rect(dir>0?x+14:x+6,y+5,2,2,'#101820')}
function draw(){ctx.clearRect(0,0,W,H);drawCity();drawTrain();for(const n of npcs){let nx=n.x-cam;if(nx>-40&&nx<W+30){let ny=player.inTunnel?world.tunnelBottom-50:world.ground-37;if(!player.inTunnel&&Math.abs(n.x-390)<55)ny=world.ground-37;drawCharacter(nx,ny,'#9ab5a7',n.dir)}}if(!player.inTrain){let py=player.y;if(player.inTunnel){py=Math.max(world.tunnelTop+45,Math.min(world.tunnelBottom-player.h,py))}drawCharacter(player.x-cam,py,'#66d9e6',player.vx>=0?1:-1)}else{drawCharacter(train.x-cam+68,train.y-1,'#66d9e6',1)}
where.textContent=player.inTrain?'Внутри поезда':player.inTunnel?'Подземный переход / метро':'Поверхность города';status.textContent='Станция 01 ↔ Станция 02 · '+(player.inTrain?'пассажир в поезде':'поезд курсирует');}
function update(dt){time+=dt;train.x+=train.dir*train.speed*dt;if(train.x>stations[1].x-70){train.x=stations[1].x-70;train.dir=-1;train.doors=true}else if(train.x<stations[0].x-70){train.x=stations[0].x-70;train.dir=1;train.doors=true}else train.doors=false;
for(const n of npcs){n.x+=n.dir*n.spd*dt;if(n.x<45||n.x>world.width-45)n.dir*=-1}
const left=keys.arrowleft||keys.a,right=keys.arrowright||keys.d,up=keys.arrowup||keys.w,down=keys.arrowdown||keys.s;
if(!player.inTrain){player.vx=(right?1:0)-(left?1:0);player.vx*=player.inTunnel?130:190;player.x+=player.vx*dt;player.x=Math.max(10,Math.min(world.width-player.w-10,player.x));
if(!player.inTunnel){if((keys[' ']||keys.space)&&player.onGround){player.vy=-340;player.onGround=false}player.vy+=850*dt;player.y+=player.vy*dt;if(player.y+player.h>=world.ground){player.y=world.ground-player.h;player.vy=0;player.onGround=true}}else{player.vy=(down?1:0)-(up?1:0);player.y+=player.vy*115*dt;player.y=Math.max(world.tunnelTop+36,Math.min(world.tunnelBottom-player.h,player.y));if(Math.abs(player.x-stations[0].x)<20&&up)player.y-=0}}
else{player.x=train.x+train.w/2;player.y=train.y}
const target=player.x-W*.45;cam=Math.max(0,Math.min(world.width-W,target));}
function frame(now){const dt=Math.min(.035,(now-last)/1000||0);last=now;update(dt);draw();requestAnimationFrame(frame)}requestAnimationFrame(frame);
})();
</script>
</body></html>
